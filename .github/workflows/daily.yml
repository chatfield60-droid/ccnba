name: Daily slate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'pipeline/**'
      - 'model/**'
  schedule:
    # 3:17, 6:17, 9:17, 12:17, and 15:17 Eastern; the script skips the DST-mismatched entry.
    - cron: '17 7,10,13,16,19 * * *'
    - cron: '17 8,11,14,17,20 * * *'
permissions:
  contents: read
concurrency:
  group: daily-slate
  cancel-in-progress: false
jobs:
  slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r pipeline/requirements.txt
      - run: npm ci --prefix pipeline
      - run: python pipeline/run_daily.py
        env:
          PYTHONPATH: model
          SCHEDULE_CRON: ${{ github.event.schedule }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PRIVATE_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_READ_WRITE_TOKEN }}
