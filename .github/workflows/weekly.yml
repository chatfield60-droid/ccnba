name: Weekly minutes model
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 1'
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r pipeline/requirements.txt
      - run: npm ci --prefix pipeline
      - run: node pipeline/blob.mjs pull
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PRIVATE_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_READ_WRITE_TOKEN }}
      - run: PYTHONPATH=model BDL_DB=bdl_nba.sqlite python -m bdlbox train-minutes
      - run: node pipeline/blob.mjs push-private minutes_model.pkl
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PRIVATE_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_READ_WRITE_TOKEN }}
